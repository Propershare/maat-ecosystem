[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maat-control-plane"
version = "0.3.1"
description = "MAAT Lab control plane CLI: doctor (machine audit), setup/repair/enroll stubs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
	"pyyaml>=6.0",
]

[project.scripts]
maat = "maat_control_plane.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["maat_control_plane"]
