[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "maat-framework"
version = "0.1.0"
description = "Personal AI that adapts, learns, and respects boundaries"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Imhotep", email = "imhotep@tehutilab.ai"}]

dependencies = [
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
train = ["unsloth", "transformers", "datasets"]
dev = ["pytest", "ruff"]

[project.scripts]
maat = "maat.cli:main"

[tool.setuptools.packages.find]
include = ["maat*"]
