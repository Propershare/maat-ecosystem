version: '3.8'

services:
  searxng:
    image: searxng/searxng:latest
    container_name: tehuti-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./config:/etc/searxng:ro
      - ./data:/usr/local/searxng/searx/data
    environment:
      - SEARXNG_HOSTNAME=127.0.0.1:8080
    restart: unless-stopped
    networks:
      - tehuti-search

networks:
  tehuti-search:
    driver: bridge
