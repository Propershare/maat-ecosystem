# Tehuti Lab — sshd hardening drop-in
# Install:  sudo cp 99-tehuti-lab.conf /etc/ssh/sshd_config.d/99-tehuti-lab.conf
#           sudo sshd -t && sudo systemctl reload ssh
# Roll back: sudo rm /etc/ssh/sshd_config.d/99-tehuti-lab.conf
#            sudo systemctl reload ssh
#
# Defaults already assumed (Ubuntu OpenSSH 8.9):
#   - PubkeyAuthentication yes
#   - KbdInteractiveAuthentication no
#   - X11Forwarding yes (we set to no)
#   - Subsystem sftp /usr/lib/openssh/sftp-server (kept)
#
# This file REQUIRES password auth off and root off, because the lab trust model is:
#   - Tailscale handles identity (no anonymous exposure to the LAN)
#   - ~/.ssh/authorized_keys is the only path in
#   - Each box has its own ed25519 keypair

# Hard-off password auth
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
UsePAM yes

# Never allow root ssh
PermitRootLogin no

# No X11 / no TCP forwarding unless you re-enable explicitly
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
GatewayPorts no

# Reasonable timeouts
ClientAliveInterval 60
ClientAliveCountMax 3
LoginGraceTime 30
MaxAuthTries 4
MaxSessions 4

# Friendlier sftp
Subsystem sftp /usr/lib/openssh/sftp-server

# Optional: log a clear banner so future-you knows this is the hardened config
Banner /etc/ssh/tehuti-lab-banner
