# Template: systemd drop-in for ollama.service
# Install: sudo cp to /etc/systemd/system/ollama.service.d/override.conf
#   OR:    sudo systemctl edit ollama   (paste [Service] block)
# Then:   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# PAST (problematic on 12GB GPU): OLLAMA_CONTEXT_LENGTH=64000
#   → huge KV cache → less VRAM for weights → more CPU offload.
#
# POLICY: See docs/OLLAMA-LOCAL-GPU-TUNING.md

[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"
Environment="OLLAMA_CONTEXT_LENGTH=16384"
# Spell-check: OLLAMA_ not OOLAMA_ (common typo — parallel would be ignored)
Environment="OLLAMA_NUM_PARALLEL=1"
# Optional: long CPU-bound generations (e.g. 20B); seconds — verify your Ollama build honors it
# Environment="OLLAMA_REQUEST_TIMEOUT=900"
