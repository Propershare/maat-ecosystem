# Tehuti Lab LDAP Server Configuration
# Maat-Aligned LDAP Server

# Schema files
include         /etc/ldap/schema/core.schema
include         /etc/ldap/schema/cosine.schema
include         /etc/ldap/schema/nis.schema
include         /etc/ldap/schema/inetorgperson.schema
include         /home/suspect/.n8n/tehuti-ldap/schema/maat.schema

# PID and args file
pidfile         /var/run/slapd/slapd.pid
argsfile        /var/run/slapd/slapd.args

# Load backend modules
modulepath      /usr/lib/ldap
moduleload      back_mdb

# TLS/SSL Configuration
TLSCertificateFile      /home/suspect/.n8n/tehuti-ldap/ssl/ldap.crt
TLSCertificateKeyFile   /home/suspect/.n8n/tehuti-ldap/ssl/ldap.key
TLSCACertificateFile    /home/suspect/.n8n/tehuti-ldap/ssl/ca.crt

# Database configuration
database        mdb
maxsize         1073741824
suffix          "dc=tehuti,dc=lab"
rootdn          "cn=admin,dc=tehuti,dc=lab"
rootpw          {SSHA}CHANGE_ME_USE_GENERATE_SECURE_PASSWORD_SCRIPT  # MUST be changed - use scripts/generate-secure-password.sh

# Directory for database files
directory       /var/lib/ldap/tehuti-lab

# Indexes for performance
index   objectClass     eq
index   uid             eq,pres,sub
index   mail            eq,pres,sub
index   cn              eq,pres,sub
index   maatRole        eq
index   maatAgentId     eq
index   workstationId   eq
index   memberOf        eq

# Logging configuration
loglevel         256
# Log levels: -1 (all), 0 (none), 1 (trace), 2 (packets), 4 (args), 8 (conns),
# 16 (BER), 32 (filter), 64 (config), 128 (ACL), 256 (stats), 512 (stats2),
# 1024 (shell), 2048 (parse), 16384 (sync), 32768 (none)
# 256 = stats (connections, operations, results)

# Log file location
# Note: OpenLDAP logs to syslog by default
# To use a custom log file, configure syslog or use logrotate

# Access control
access to attrs=userPassword
    by self write
    by anonymous auth
    by dn="cn=admin,dc=tehuti,dc=lab" write
    by * none

access to *
    by self write
    by dn="cn=admin,dc=tehuti,dc=lab" write
    by users read
    by * none

