# maatecosystem.com — Ka Education / Ma'at product site (SPA + BFF on :3008)
# Deploy: bash scripts/install-maatecosystem-ssl.sh

server {
    listen 443 ssl;
    server_name maatecosystem.com www.maatecosystem.com;

    ssl_certificate     /etc/letsencrypt/live/maatecosystem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maatecosystem.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    access_log /var/log/nginx/maatecosystem.com.access.log;
    error_log /var/log/nginx/maatecosystem.com.error.log;
}

server {
    listen 80;
    server_name maatecosystem.com www.maatecosystem.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
